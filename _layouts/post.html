---
layout: default
---
<article class="window">
  <header class="titlebar">
    <h1>{{ page.title }}</h1>
  </header>
  <div class="window-body">
    <p class="post-date"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
    {{ content }}
    <p class="post-back"><a href="{{ '/news/' | relative_url }}">← All news</a></p>
  </div>
</article>
