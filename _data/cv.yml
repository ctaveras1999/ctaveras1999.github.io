# Single source for the Academic page (tabs/academic/academic.md) AND the CV PDF (cv/build.rb).
# Publications and presentations live in _data/pubs.yml.
#
# Website entries take:
#   what:   The main line, shown in bold (required). Markdown works, e.g. a [link](https://...).
#   where:  Institution, venue, or company, shown after the bold part (optional)
#   when:   Date or date range, shown on the right (optional)
#   desc:   A sentence or two underneath (optional). Markdown works.
#           Wrap text in quotes if it contains a colon.
#
# CV-only fields (ignored by the website):
#   cv:       Overrides for the PDF, with the same keys plus `bullets` (a list of lines). Use it when
#             the CV should say something different from the website.
#   cv: false Leaves the entry out of the PDF.
# Sections the website doesn't show (profile, employment) are used only by the PDF.

profile:
  name: "Carlos A. Taveras"
  webpage: "https://ctaveras1999.github.io/"
  scholar: "https://scholar.google.com/citations?user=sw4tzEoAAAAJ&hl=en"
  email: "ctaveras1999@gmail.com"
  research_interests: ["Schrödinger Operators", "Ergodic Theory", "Spectral Theory"]

# CV layout: **where**, *location* (right: when), then `what`, then `cv: details` lines.
