# CV layout: **what**, *where* (right: when), then bullets.
teaching:
  - what: "Instructor, Techniques of a Pro Mathematician"
    where: "[Tapia STEM Camps](https://tapiacenter.rice.edu/tapia-stem-camps), Rice"
    when: "Summer 2026"
    desc: "A summer camp introducing high school students across Texas to various STEM topics. Alongside Prof. Paul Hand (the Tapia Camps director), I co-taught three week-long sessions focused on developing some of the hard and soft skills needed to succeed in college math and beyond. I learned a bunch, gained invaluable experience in effective and engaging pedagogy, and grew a deeper appreciation for K-12 teachers."
    cv:
      what: "Instructor"
      where: "Tapia STEM Camps at Rice University"
      when: "2026"
      bullets:
        - "Led three week-long sessions of [*Techniques of a Pro Mathematician*](https://tapiacenter.rice.edu/tapia-stem-camps) introducing high school students to undergraduate-level mathematical abstraction and problem solving"
  - what: "Tutor"
    where: "SpiderSmart River Oaks Learning Center"
    when: "2026"
    desc: "Tutored primary and secondary school students in various elementary math subjects."
    cv:
      bullets: ["Tutored several primary and secondary school students in various elementary math subjects"]
  - what: "TA, ELEC 303: Random Signals"
    where: "Rice"
    when: "Fall 2023, 2024, 2025"
    desc: "A first course in probability and random processes for ECE undergrads: discrete and continuous random variables, laws of large numbers, the central limit theorem, and basic estimation theory."
    cv:
      what: "Teaching Assistant and Grader"
      where: "Rice University"
      when: "2023–2025"
      bullets:
        - "Led recitations, held office hours, and created/graded homework for *Random Signals (ELEC 303)*, a course on probability and statistics for engineers"
  - what: "TA, 18-290: Signals and Systems"
    where: "CMU"
    when: "Fall 2021 & Spring 2022"
    desc: "A first course in signal processing: continuous and discrete signal representations, linear time-invariant systems, convolutions, basic Fourier theory, and sampling."
    cv:   # both CMU courses are one entry on the CV
      what: "Teaching Assistant and Grader"
      where: "Carnegie Mellon University"
      when: "2021–2022"
      bullets:
        - "Led recitations, held office hours, and graded for *Signals and Systems (18-290)*, a course on basic properties of discrete/continuous-time linear and time-invariant systems (operators)"
        - "Held office hours and graded for *Fundamentals of Signal Processing (18-491/691)*, a course on the basic theory and algorithms of discrete-time signal processing"
  - what: "TA, 18-491/691: Fundamentals of Signal Processing"
    where: "CMU"
    when: "Spring 2021"
    desc: "A second course in signal processing: relationships between continuous and discrete signal representations and related transforms (Fourier series, Fourier transforms, z-transforms, short-time), filter design, time-frequency representations, multi-rate processing, and the Fast Fourier Transform."
    cv: false   # covered by the CMU entry above

