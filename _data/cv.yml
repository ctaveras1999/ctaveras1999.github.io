    desc: "Advisors: [César A. Uribe](https://cauribe.rice.edu/) and [Santiago Segarra](https://segarra.rice.edu/). Thesis: [*Efficient Path Planning with Soft Homology Constraints*](https://repository.rice.edu/items/87afda7a-6a85-452e-8954-02b11b7e0c2a)."
    cv:
      details:
        - "Advisors: César A. Uribe and Santiago Segarra"
        - "Thesis: Efficient Path Planning with Soft Homology Constraints"
  - what: "B.S. & M.S. in Electrical and Computer Engineering"
    where: "Carnegie Mellon University"
    location: "Pittsburgh, PA"
    when: "2017–2022"

