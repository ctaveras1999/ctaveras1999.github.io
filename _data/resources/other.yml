# Data for the sections of the Resources page (tabs/resources/resources.md) other than the list of
# academics (that one is learning_people.yml). Each section shows its entries in the order of this file.
#
#   name:        Display name (required)
#   section:     Which section of the page it appears in (required):
#                  learning    "More Places to Learn" (under Learning Materials)
#                  undergrad   "For Undergraduates"
#                  grad        "For Graduate Students"
#                  research    "For Researchers"
#                  media       "Math Media"
#   topics:      One type, shown as a tag, e.g. [Quals] (optional)
#   affiliation: Short institution name, shown in gray (optional)
#   description: A sentence about it (optional). Markdown works. Quote it if it contains a colon.
#   links:       One {label, url} per link

