#   name:        Title of the post, paper, or video (required). Shown in bold and linked to `url`.
#   url:         Where the title links (required)
#   people:      Authors / speakers / panelists (optional), shown in gray next to the title.
#                "Person, A–Z" sorts by this.
#   source:      Where it was published (optional), shown as an outlined tag: the YouTube channel
#                ("YouTube: Numberphile"), blog ("Gowers's Weblog"), magazine, journal, arXiv, ...
#   date:        When it was published or uploaded (optional): "YYYY-MM-DD", or just "YYYY".
#                "Newest first" (the default sort) uses it; undated entries go last.
#   topics:      One type, shown as a tag and filter chip (required). Reuse an existing one where possible:
#                Blogs, Blog Posts, Essays & Articles, Declarations & Statements, Classics, Talks & Panels,
#                Recent Results, Using AI for Research, Education, Interview Series, SAIR, Candid Reactions
#   description: A short note (optional). Markdown works.
#   links:       Extra links shown on the right, as {label, url} (optional)
#
# Keep entries of the same type together; the filter chips follow the order types first appear here.


