# Weekly check for broken links. Builds the site, checks every link in it with lychee, and keeps
# one GitHub issue labeled "broken-links" up to date: opened or updated when links break, closed
# once everything passes. It never blocks deploys. Run it by hand from the Actions tab
# ("Check links" > Run workflow) or with:  gh workflow run "Check links"
# Settings (ignored links, accepted status codes) are in .lychee.toml.
name: Check links

on:
  schedule:
    - cron: "0 14 * * 1"   # Mondays at 14:00 UTC (8 or 9 a.m. in Houston)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Build the site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config .lychee.toml
            --root-dir "${{ github.workspace }}/_site"
            '_site/**/*.html'
          output: lychee-report.md
          fail: false

      - name: Open, update, or close the broken-links issue
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_CODE: ${{ steps.lychee.outputs.exit_code }}
        run: |
          gh label create broken-links --color d93f0b \
            --description "Found by the weekly link check" --force
          issue=$(gh issue list --label broken-links --state open --json number --jq '.[0].number // empty')
          if [ "$EXIT_CODE" != "0" ]; then
            if [ -n "$issue" ]; then
              gh issue edit "$issue" --body-file lychee-report.md
              gh issue comment "$issue" --body "Still failing as of the check on $(date -u +%F)."
            else
              gh issue create --title "Broken links" --label broken-links --body-file lychee-report.md
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "All links passed the check on $(date -u +%F)."
          fi
