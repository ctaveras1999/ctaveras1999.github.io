# Weekly check for broken links. Builds the site and checks every link in it with lychee.
# If any link is broken, the run fails (a red X in the Actions tab, and GitHub emails you) and
# the list of broken links is on the run's summary page. It never blocks deploys. Run it by hand
# from the Actions tab ("Check links" > Run workflow) or with:  gh workflow run "Check links"
# Settings (ignored links, accepted status codes) are in .lychee.toml.
name: Check links

on:
  schedule:
    - cron: "0 14 * * 1"   # Mondays at 14:00 UTC (8 or 9 a.m. in Houston)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Build the site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config .lychee.toml
            --root-dir "${{ github.workspace }}/_site"
            '_site/**/*.html'
          jobSummary: true   # broken links are listed on the run's summary page
          fail: true         # a broken link fails the run, which triggers GitHub's email
