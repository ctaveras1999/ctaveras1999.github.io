{%- comment -%}
  MathJax, loaded only on pages with `mathjax: true` in their front matter
  (or on every page if `mathjax: true` is set in _config.yml).
  Inline math:  $...$  or  \(...\)      Display math:  $$...$$  or  \[...\]
  Write \$ for a literal dollar sign on these pages.
{%- endcomment -%}
<script>
  window.MathJax = {
    tex: {
      inlineMath: [["$", "$"], ["\\(", "\\)"]],
      displayMath: [["$$", "$$"], ["\\[", "\\]"]],
      processEscapes: true
    },
    options: {
      skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"]
    }
  };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js"></script>
